[workspace]
resolver = "2"
members = ["crates/air-state", "crates/air-valorant"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
air-state = { path = "crates/air-state" }
air-valorant = { path = "crates/air-valorant" }

[profile.release]
lto = "thin"
codegen-units = 1
